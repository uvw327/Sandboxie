name: Unlock Build

on:
  push:
    branches: [unlock]
  workflow_dispatch:

jobs:
  build_x64:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Load Variables from buildVariables.cmd
        shell: cmd
        run: |
          @echo on
          call "${{ github.workspace }}\Installer\buildVariables.cmd" build_qt6
          echo qt6_version=%qt6_version% >> %GITHUB_ENV%
          echo qt_version=%qt6_version% >> %GITHUB_ENV%

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      #
      # Compile Sandboxie Core (x64 target; Win32 DLLs for WoW64)
      #

      - name: Build Sandboxie x86 (DLLs & svc)
        run: msbuild /t:build Sandboxie\SandboxDll.sln /p:Configuration="SbieRelease" /p:Platform=Win32 -maxcpucount:8

      - name: Build Sandboxie x64 (all)
        run: msbuild /t:build Sandboxie\Sandbox.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      - name: Build Sandboxie x64 (drv)
        run: msbuild /t:build Sandboxie\SandboxDrv.sln /p:Configuration="SbieRelease" /p:Platform=x64 -maxcpucount:8

      #
      # Prepare Qt
      #

      - name: Install Qt6 x64
        run: SandboxiePlus\install_qt.cmd x64

      - name: Cache jom archive
        id: cache-jom
        uses: actions/cache@v6.1.0
        with:
          path: jom_1_1_4.zip
          key: jom-1.1.4-${{ runner.os }}
          restore-keys: |
            jom-1.1.4-
            jom-
          fail-on-cache-miss: false

      - name: Installing Jom
        shell: cmd
        run: SandboxiePlus\install_jom.cmd

      #
      # Compile Sandboxie-Plus
      #

      - name: Build Sandboxie-Plus x64
        run: SandboxiePlus\qmake_plus.cmd x64 build_qt6

      - name: Build SbieShell x64
        run: msbuild /t:restore,build -p:RestorePackagesConfig=true SandboxiePlus\SbieShell\SbieShell.sln /p:Configuration="Release" /p:Platform=x64

      - name: Build Sandboxie-Tools x64
        run: msbuild /t:build SandboxieTools\SandboxieTools.sln /p:Configuration="Release" /p:Platform=x64 -maxcpucount:8

      - name: Build SbieUnlockTest x64
        run: msbuild SandboxieTools\SbieUnlockTest\SbieUnlockTest.vcxproj /p:Configuration=Release /p:Platform=x64

      #
      # Merge
      #

      - name: Add missing languages for Qt6
        run: Installer\fix_qt5_languages.cmd x64 build_qt6

      - name: Get openssl binaries
        run: Installer\get_openssl.cmd

      - name: Get 7z binaries
        run: Installer\get_7zip.cmd

      - name: Merging Build
        run: Installer\copy_build.cmd x64 build_qt6

      #
      # Test signing (Phase 2: testsigning validation)
      #

      - name: Create test signing certificate
        shell: pwsh
        run: |
          $subject = "CN=Sandboxie-Plus Unlocked Test"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject `
            -KeyUsage DigitalSignature -FriendlyName "SbieUnlockTest" `
            -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(10)
          $pwdPlain = "SbieTest123"
          $pwd = ConvertTo-SecureString -String $pwdPlain -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "sbie-test.pfx" -Password $pwd | Out-Null
          Export-Certificate -Cert $cert -FilePath "sbie-test.cer" | Out-Null
          "SBIE_TEST_PFX_PWD=$pwdPlain" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "Signing certificate: $($cert.Subject) thumbprint=$($cert.Thumbprint)"

      - name: Sign SbieDrv.sys for test signing
        shell: cmd
        run: |
          "%SIGNTOOL%" sign /fd SHA256 /f sbie-test.pfx /p %SBIE_TEST_PFX_PWD% Installer\SbiePlus_x64\SbieDrv.sys
          if errorlevel 1 exit /b 1
          dir Installer\SbiePlus_x64\SbieDrv.sys

      - name: Add test signing helper files
        shell: cmd
        run: |
          copy /y Installer\unlock\testsign-prepare.cmd Installer\SbiePlus_x64\
          copy /y Installer\unlock\testsign-install.cmd Installer\SbiePlus_x64\
          copy /y Installer\unlock\testsign-uninstall.cmd Installer\SbiePlus_x64\
          copy /y Installer\unlock\install-unlocked.cmd Installer\SbiePlus_x64\
          copy /y Installer\unlock\uninstall-unlocked.cmd Installer\SbiePlus_x64\
          copy /y Installer\unlock\README.txt Installer\SbiePlus_x64\
          copy /y sbie-test.cer Installer\SbiePlus_x64\
          copy /y SandboxieTools\SbieUnlockTest\bin\x64\Release\SbieUnlockTest.exe Installer\SbiePlus_x64\

      - name: Verify signed driver
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature Installer\SbiePlus_x64\SbieDrv.sys
          "Signature status (self-signed, not trusted on runner is expected): $($sig.Status)"
          "Signer: $($sig.SignerCertificate.Subject)"
          if (-not $sig.SignerCertificate) { throw "SbieDrv.sys has no signature" }

      #
      # Package
      #

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem Installer\SbiePlus_x64 | Select-Object Name, Length | Format-Table -AutoSize
          $drv = Get-Item Installer\SbiePlus_x64\SbieDrv.sys
          "SbieDrv.sys: $($drv.Length) bytes, version $($drv.VersionInfo.FileVersion)"
          Get-ChildItem Installer\SbiePlus_x64\32 -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize

      - name: Package zip
        shell: pwsh
        run: |
          $zip = "Sandboxie-Plus-Unlocked-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "Installer\SbiePlus_x64\*" -DestinationPath $zip -CompressionLevel Optimal
          $h = Get-FileHash $zip -Algorithm SHA256
          "SHA256: $($h.Hash)"
          "SIZE: $((Get-Item $zip).Length)"
          $h.Hash | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Sandboxie-Plus-Unlocked-x64
          path: |
            Sandboxie-Plus-Unlocked-x64.zip
            Sandboxie-Plus-Unlocked-x64.zip.sha256
          retention-days: 30
